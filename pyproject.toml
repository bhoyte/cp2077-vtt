[project]
name = "arcade"
version = "0.1.0"
description = "Night City Arcade: chat-driven Cyberpunk TTRPG broadcast engine"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
